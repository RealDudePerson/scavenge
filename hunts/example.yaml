# Scavenger Hunt Configuration Example
name: "Fall Campus Hunt"
description: "Find hidden items around campus"
theme:
  primary: "#FF6B9D"
  secondary: "#FEC868"
  accent: "#7AC74F"
  background: "#FFF8F0"
  surface: "#FFFFFF"
  text: "#2D3142"
  text_muted: "#6C757D"
  success: "#06A77D"
  warning: "#E63946"
  info: "#4A90E2"
items:
  - name: "Library Clock"
    description: "The big clock in the main library"
    points: 100
    bonus_points: 50
    bonus_hint: "A clear, front-on shot of the clock face is the most reliable way to earn the bonus."
    required_properties:
      - "shows a clock"
      - "shows the main library building"
    bonus_properties:
      - "clock face is clearly visible"
  - name: "Secret Fountain"
    description: "Hidden behind the science building"
    points: 150
    bonus_points: 75
    bonus_hint: "Daytime shots of flowing water look best — try to capture the fountain in full motion."
    required_properties:
      - "shows a fountain with water"
      - "shows the science building nearby"
    bonus_properties:
      - "taken during daytime"